<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f3f4f6;
    padding: 48px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px 0; }
  h2 { font-size: 19px; font-weight: 600; margin: 28px 0 8px 0; }
  a { color: #38bdf8; }
  .back { display: inline-block; font-size: 14px; margin-bottom: 24px; text-decoration: none; }
  .meta { color: #9ca3af; font-size: 14px; margin: 0 0 24px 0; }
  .pages { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .pages a {
    display: block;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 16px 20px;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .pages a:hover { border-color: #38bdf8; transform: translateY(-2px); }
  .pages .date { display: block; color: #9ca3af; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    {% if page.url != "/" %}<a class="back" href="{{ '/' | relative_url }}">&larr; All cooking pages</a>{% else %}<a class="back" href="/">&larr; slackermandan.com</a>{% endif %}
    {{ content }}
  </div>
</body>
</html>
