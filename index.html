---
layout: default
---
<h1>Cooking</h1>
<p class="meta">{{ site.description }}</p>

{% assign entries = site.pages | where: "entry", true | sort: "date" %}
<ul class="pages">
  {% for p in entries %}
  <li><a href="{{ p.url | relative_url }}">{{ p.title }}<span class="date">{{ p.date | date: "%B %-d, %Y" }}</span></a></li>
  {% endfor %}
</ul>
